<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customizador Automotivo 3D - Jeep Renegade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white relative h-screen w-screen">

    <div class="absolute top-0 left-0 w-full h-full z-0">
        <iframe 
            class="w-full h-full"
            title="Jeep Renegade 2016" 
            frameborder="0" 
            allowfullscreen 
            mozallowfullscreen="true" 
            webkitallowfullscreen="true" 
            allow="autoplay; fullscreen; xr-spatial-tracking" 
            xr-spatial-tracking 
            execution-while-out-of-viewport 
            execution-while-not-rendered 
            web-share 
            src="https://sketchfab.com/models/192f7e81dce84c6780434f692a0f96c5/embed?autostart=1&ui_theme=dark"> 
        </iframe>
    </div>

    <div class="absolute bottom-0 left-0 w-full p-6 z-10 pointer-events-none">
        <div class="max-w-4xl mx-auto bg-black/40 backdrop-blur-md rounded-3xl p-6 border border-white/20 shadow-2xl pointer-events-auto">
            
            <h2 class="text-xl font-semibold mb-4 text-white">Personalize seu Jeep Renegade</h2>
            
            <div class="flex gap-4 overflow-x-auto pb-2">
                <button class="px-4 py-2 bg-white text-black rounded-full font-medium transition-all hover:bg-gray-200 shadow-sm">Cor da Pintura</button>

            </div>

            <div class="mt-6 flex items-center gap-4">
                <button class="w-10 h-10 rounded-full bg-[#4A4A4A] cursor-pointer border-2 border-white shadow-lg ring-2 ring-white/30" title="Cinza Chumbo"></button>
                <button class="w-10 h-10 rounded-full bg-red-700 cursor-pointer border-2 border-transparent hover:border-white transition-all" title="Vermelho Colorado"></button>
                <button class="w-10 h-10 rounded-full bg-black cursor-pointer border-2 border-transparent hover:border-white transition-all" title="Preto Carbono"></button>
                <button class="w-10 h-10 rounded-full bg-white cursor-pointer border-2 border-transparent hover:border-white transition-all" title="Branco Polar"></button>

        </div>
