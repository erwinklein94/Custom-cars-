    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Archivo', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        letter-spacing: -0.01em;
    }

    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Loading */
    #loader {
        position: fixed; inset: 0;
        background: var(--bg-primary);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
        transition: opacity 0.6s ease, visibility 0.6s;
    }
    #loader.hidden { opacity: 0; visibility: hidden; }
    .loader-ring {
        width: 48px; height: 48px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-secondary);
    }

    /* Canvas */
    #canvas-container {
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, #1a1a1a 0%, #0a0a0a 70%);
    }
    canvas { display: block; }

    /* Top Bar */
    .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        padding: 24px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }

    .brand {
        display: flex;
        flex-direction: column;
        line-height: 1;
    }
    .brand-name {
        font-weight: 900;
        font-size: 20px;
        letter-spacing: -0.03em;
    }
    .brand-sub {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 4px;
    }

    .model-info {
        text-align: right;
    }
    .model-name {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.01em;
    }
    .model-year {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--text-muted);
        margin-top: 2px;
    }

    /* Side indicator */
    .side-indicator {
        position: fixed;
        left: 32px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        writing-mode: vertical-rl;
        transform: translateY(-50%) rotate(180deg);
    }

    /* Price display */
    .price-display {
        position: fixed;
        right: 32px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 5;
        text-align: right;
    }
    .price-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
    }
    .price-value {
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.03em;
    }
    .price-value .currency {
        font-size: 14px;
        color: var(--text-secondary);
        margin-right: 4px;
        font-weight: 500;
    }

    /* Bottom Panel */
    .config-panel {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        padding: 24px 32px 32px;
        z-index: 10;
        background: linear-gradient(to top, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.7) 60%, transparent 100%);
        backdrop-filter: blur(8px);
    }

    .config-inner {
        max-width: 1400px;
        margin: 0 auto;
    }

    /* Tabs */
    .tabs {
        display: flex;
        gap: 2px;
        margin-bottom: 24px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0;
    }
    .tab {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-family: 'Archivo', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 14px 20px;
        cursor: pointer;
        position: relative;
        transition: color 0.3s;
    }
    .tab:hover { color: var(--text-secondary); }
    .tab.active { color: var(--text-primary); }
    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px; left: 0; right: 0;
        height: 1px;
        background: var(--accent);
    }
    .tab .tab-num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        color: var(--text-muted);
        margin-right: 8px;
        vertical-align: top;
    }

    /* Content rows */
    .config-content {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 48px;
        align-items: end;
    }

    .color-section {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    .section-header {
        display: flex;
        align-items: baseline;
        gap: 16px;
    }
    .section-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: var(--text-muted);
    }
    .section-value {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
    }
    .section-value .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: var(--text-muted);
        font-weight: 500;
        margin-left: 8px;
    }

    .color-grid {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
    }

    .color-option {
        background: transparent;
        border: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 0;
        transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .color-option:hover { transform: translateY(-4px); }

    .color-swatch {
        width: 56px; height: 56px;
        border-radius: 4px;
        position: relative;
        transition: all 0.3s;
        box-shadow: 
            inset 0 0 0 1px rgba(255,255,255,0.08),
            inset 0 -12px 20px rgba(0,0,0,0.3),
            inset 0 8px 12px rgba(255,255,255,0.08),
            0 8px 24px rgba(0,0,0,0.4);
    }
    .color-option.active .color-swatch {
        box-shadow: 
            inset 0 0 0 1px rgba(255,255,255,0.12),
            inset 0 -12px 20px rgba(0,0,0,0.3),
            inset 0 8px 12px rgba(255,255,255,0.08),
            0 8px 24px rgba(0,0,0,0.4),
            0 0 0 2px var(--bg-primary),
            0 0 0 3px var(--accent);
    }
    .color-swatch::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 4px;
        background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.05) 100%);
        pointer-events: none;
    }

    .color-info {
        text-align: left;
        min-width: 56px;
    }
    .color-name {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--text-secondary);
        transition: color 0.3s;
        white-space: nowrap;
    }
    .color-option.active .color-name {
        color: var(--text-primary);
    }
    .color-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        color: var(--text-muted);
        margin-top: 2px;
        letter-spacing: 0.05em;
    }

    /* Actions */
    .actions {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .btn {
        font-family: 'Archivo', sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 14px 24px;
        border-radius: 2px;
        cursor: pointer;
        transition: all 0.3s;
        border: 1px solid var(--border-strong);
        background: transparent;
        color: var(--text-primary);
    }
    .btn:hover {
        border-color: var(--text-primary);
        background: rgba(255,255,255,0.05);
    }
    .btn-primary {
        background: var(--accent);
        color: #0a0a0a;
        border-color: var(--accent);
    }
    .btn-primary:hover {
        background: var(--accent-bright);
        border-color: var(--accent-bright);
        color: #0a0a0a;
    }

    /* Controls hint */
    .controls-hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--text-muted);
        z-index: 5;
        pointer-events: none;
        opacity: 0;
        animation: hintFade 4s ease-out forwards;
        animation-delay: 1s;
    }
    @keyframes hintFade {
        0% { opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* Corner decorations */
    .corner {
        position: fixed;
        width: 20px; height: 20px;
        border: 1px solid var(--border-strong);
        z-index: 5;
        pointer-events: none;
    }
    .corner.tl { top: 80px; left: 32px; border-right: none; border-bottom: none; }
    .corner.tr { top: 80px; right: 32px; border-left: none; border-bottom: none; }

    @media (max-width: 768px) {
        .topbar { padding: 16px; }
        .config-panel { padding: 16px; }
        .side-indicator, .price-display, .corner { display: none; }
        .brand-name { font-size: 16px; }
        .color-swatch { width: 44px; height: 44px; }
        .config-content { grid-template-columns: 1fr; gap: 20px; }
        .actions { width: 100%; }
        .btn { flex: 1; padding: 12px; font-size: 11px; }
    }
</style>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

    // --- Paleta de cores ---
    const colors = [
        { name: 'Granito Cristal', code: 'PX8', hex: 0x3a3d42, price: 149990, metallic: 0.9, roughness: 0.35 },
        { name: 'Vermelho Colorado', code: 'PR4', hex: 0x8b1a1a, price: 151490, metallic: 0.85, roughness: 0.3 },
        { name: 'Preto Carbon', code: 'PXR', hex: 0x0a0a0a, price: 151490, metallic: 0.95, roughness: 0.25 },
        { name: 'Branco Polar', code: 'PW7', hex: 0xeeeeea, price: 149990, metallic: 0.4, roughness: 0.4 },
        { name: 'Azul Jazz', code: 'PBU', hex: 0x1e3a5f, price: 151490, metallic: 0.9, roughness: 0.3 },
        { name: 'Verde Militar', code: 'PGR', hex: 0x3d4a2a, price: 152990, metallic: 0.7, roughness: 0.5 },
        { name: 'Laranja Omaha', code: 'POR', hex: 0xc8501e, price: 152990, metallic: 0.85, roughness: 0.35 },
    ];

    let currentColorIndex = 0;

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 2.2, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.minPolarAngle = Math.PI / 6;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;
    controls.target.set(0, 0.7, 0);

    // Lighting — studio setup
    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xfff4e0, 2.2);
    keyLight.position.set(6, 10, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xa0c0ff, 0.8);
    fillLight.position.set(-6, 4, -3);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffccaa, 1.2);
    rimLight.position.set(-3, 6, -8);
    scene.add(rimLight);

    // Environment reflection (simulado)
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    const envGeo = new THREE.SphereGeometry(50, 32, 32);
    const envMat = new THREE.MeshBasicMaterial({
        side: THREE.BackSide,
        color: 0x202028
    });
    envScene.add(new THREE.Mesh(envGeo, envMat));
    // lights inside env for reflections
    const envL1 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    envL1.position.set(0, 8, -10); envScene.add(envL1);
    const envL2 = new THREE.Mesh(new THREE.PlaneGeometry(20, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    envL2.position.set(0, 8, 10); envL2.rotation.y = Math.PI; envScene.add(envL2);
    const envTexture = pmrem.fromScene(envScene).texture;
    scene.environment = envTexture;

    // Ground
    const groundGeo = new THREE.CircleGeometry(20, 64);
    const groundMat = new THREE.MeshStandardMaterial({
        color: 0x0f0f0f,
        roughness: 0.4,
        metalness: 0.2
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Grid acent
    const grid = new THREE.GridHelper(20, 40, 0x1a1a1a, 0x151515);
    grid.position.y = 0.001;
    scene.add(grid);

    // --- Construção do carro (estilizado, baixo-poly refinado) ---
    const carGroup = new THREE.Group();

    // Material da carroceria (será atualizado com cor)
    const bodyMaterial = new THREE.MeshPhysicalMaterial({
        color: colors[0].hex,
        metalness: colors[0].metallic,
        roughness: colors[0].roughness,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        envMapIntensity: 1.5,
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
        color: 0x0a0a0a,
        metalness: 0.4,
        roughness: 0.6
    });

    const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x111111,
        metalness: 0.1,
        roughness: 0.05,
        transmission: 0.4,
        thickness: 0.5,
        envMapIntensity: 2
    });

    const chromeMaterial = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 1.0,
        roughness: 0.15
    });

    const tireMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a1a1a,
        roughness: 0.9,
        metalness: 0.0
    });

    const rimMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a4a4a,
        metalness: 0.9,
        roughness: 0.3
    });

    // ---- CARROCERIA ----
    // Corpo inferior (chassi)
    const chassisGeo = new THREE.BoxGeometry(2.0, 0.5, 4.2);
    const chassis = new THREE.Mesh(chassisGeo, bodyMaterial);
    chassis.position.y = 0.7;
    chassis.castShadow = true;
    carGroup.add(chassis);

    // Corpo superior (cabine) - formato SUV boxy como Renegade
    const cabinGeo = new THREE.BoxGeometry(1.85, 0.9, 2.8);
    const cabin = new THREE.Mesh(cabinGeo, bodyMaterial);
    cabin.position.set(0, 1.35, -0.1);
    cabin.castShadow = true;
    carGroup.add(cabin);

    // Teto (ligeiramente menor para dar forma)
    const roofGeo = new THREE.BoxGeometry(1.7, 0.08, 2.6);
    const roof = new THREE.Mesh(roofGeo, bodyMaterial);
    roof.position.set(0, 1.84, -0.1);
    roof.castShadow = true;
    carGroup.add(roof);

    // Capô frontal (ligeiramente inclinado)
    const hoodGeo = new THREE.BoxGeometry(1.85, 0.1, 1.2);
    const hood = new THREE.Mesh(hoodGeo, bodyMaterial);
    hood.position.set(0, 0.99, 1.5);
    hood.castShadow = true;
    carGroup.add(hood);

    // Para-choque dianteiro
    const bumperFGeo = new THREE.BoxGeometry(2.05, 0.45, 0.4);
    const bumperF = new THREE.Mesh(bumperFGeo, darkMaterial);
    bumperF.position.set(0, 0.55, 2.1);
    bumperF.castShadow = true;
    carGroup.add(bumperF);

    // Para-choque traseiro
    const bumperBGeo = new THREE.BoxGeometry(2.05, 0.45, 0.4);
    const bumperB = new THREE.Mesh(bumperBGeo, darkMaterial);
    bumperB.position.set(0, 0.55, -2.1);
    bumperB.castShadow = true;
    carGroup.add(bumperB);

    // Grade frontal (7-slot característica do Jeep)
    for (let i = 0; i < 7; i++) {
        const slotGeo = new THREE.BoxGeometry(0.12, 0.35, 0.05);
        const slot = new THREE.Mesh(slotGeo, new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.3 }));
        slot.position.set(-0.65 + i * 0.22, 0.92, 2.14);
        carGroup.add(slot);
    }

    // Moldura da grade
    const grilleFrameGeo = new THREE.BoxGeometry(1.75, 0.5, 0.06);
    const grilleFrame = new THREE.Mesh(grilleFrameGeo, chromeMaterial);
    grilleFrame.position.set(0, 0.92, 2.13);
    carGroup.add(grilleFrame);

    // Faróis
    const headlightGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.08, 24);
    const headlightMat = new THREE.MeshStandardMaterial({
        color: 0xffffee,
        emissive: 0xffffcc,
        emissiveIntensity: 0.5,
        metalness: 0.8,
        roughness: 0.1
    });
    const headlightL = new THREE.Mesh(headlightGeo, headlightMat);
    headlightL.rotation.x = Math.PI / 2;
    headlightL.position.set(-0.78, 0.95, 2.14);
    carGroup.add(headlightL);
    const headlightR = new THREE.Mesh(headlightGeo, headlightMat);
    headlightR.rotation.x = Math.PI / 2;
    headlightR.position.set(0.78, 0.95, 2.14);
    carGroup.add(headlightR);

    // Lanternas traseiras
    const taillightGeo = new THREE.BoxGeometry(0.35, 0.2, 0.06);
    const taillightMat = new THREE.MeshStandardMaterial({
        color: 0x550000,
        emissive: 0xaa0000,
        emissiveIntensity: 0.4
    });
    const taillightL = new THREE.Mesh(taillightGeo, taillightMat);
    taillightL.position.set(-0.75, 0.85, -2.12);
    carGroup.add(taillightL);
    const taillightR = new THREE.Mesh(taillightGeo, taillightMat);
    taillightR.position.set(0.75, 0.85, -2.12);
    carGroup.add(taillightR);

    // Janelas (parabrisa, laterais, traseira)
    const windshieldGeo = new THREE.BoxGeometry(1.7, 0.75, 0.05);
    const windshield = new THREE.Mesh(windshieldGeo, glassMaterial);
    windshield.position.set(0, 1.4, 1.28);
    windshield.rotation.x = -0.25;
    carGroup.add(windshield);

    const rearWindowGeo = new THREE.BoxGeometry(1.7, 0.7, 0.05);
    const rearWindow = new THREE.Mesh(rearWindowGeo, glassMaterial);
    rearWindow.position.set(0, 1.4, -1.5);
    rearWindow.rotation.x = 0.2;
    carGroup.add(rearWindow);

    // Janelas laterais
    const sideWinGeo = new THREE.BoxGeometry(0.05, 0.55, 2.4);
    const sideWinL = new THREE.Mesh(sideWinGeo, glassMaterial);
    sideWinL.position.set(-0.93, 1.45, -0.1);
    carGroup.add(sideWinL);
    const sideWinR = new THREE.Mesh(sideWinGeo, glassMaterial);
    sideWinR.position.set(0.93, 1.45, -0.1);
    carGroup.add(sideWinR);

    // Pilar separador
    const pillarGeo = new THREE.BoxGeometry(0.08, 0.9, 0.08);
    for (let x of [-0.93, 0.93]) {
        const pillar = new THREE.Mesh(pillarGeo, darkMaterial);
        pillar.position.set(x, 1.4, -0.1);
        carGroup.add(pillar);
    }

    // Linha de cintura (acent cromado)
    const beltlineGeo = new THREE.BoxGeometry(0.04, 0.025, 3.9);
    for (let x of [-0.96, 0.96]) {
        const belt = new THREE.Mesh(beltlineGeo, chromeMaterial);
        belt.position.set(x, 1.04, -0.1);
        carGroup.add(belt);
    }

    // Rack de teto
    const rackGeo = new THREE.BoxGeometry(0.05, 0.04, 2.3);
    for (let x of [-0.7, 0.7]) {
        const rackBar = new THREE.Mesh(rackGeo, darkMaterial);
        rackBar.position.set(x, 1.9, -0.1);
        carGroup.add(rackBar);
    }

    // Retrovisores
    const mirrorGeo = new THREE.BoxGeometry(0.15, 0.12, 0.2);
    const mirrorL = new THREE.Mesh(mirrorGeo, bodyMaterial);
    mirrorL.position.set(-1.0, 1.35, 0.8);
    carGroup.add(mirrorL);
    const mirrorR = new THREE.Mesh(mirrorGeo, bodyMaterial);
    mirrorR.position.set(1.0, 1.35, 0.8);
    carGroup.add(mirrorR);

    // Maçanetas
    const handleGeo = new THREE.BoxGeometry(0.04, 0.04, 0.2);
    const handlePositions = [
        [-0.96, 1.1, 0.3], [0.96, 1.1, 0.3],
        [-0.96, 1.1, -0.6], [0.96, 1.1, -0.6]
    ];
    handlePositions.forEach(p => {
        const h = new THREE.Mesh(handleGeo, chromeMaterial);
        h.position.set(...p);
        carGroup.add(h);
    });

    // ---- RODAS ----
    function createWheel(x, z) {
        const wheelGroup = new THREE.Group();

        // Pneu
        const tireGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.28, 32);
        const tire = new THREE.Mesh(tireGeo, tireMaterial);
        tire.rotation.z = Math.PI / 2;
        tire.castShadow = true;
        wheelGroup.add(tire);

        // Aro
        const rimGeo = new THREE.CylinderGeometry(0.32, 0.32, 0.3, 24);
        const rim = new THREE.Mesh(rimGeo, rimMaterial);
        rim.rotation.z = Math.PI / 2;
        wheelGroup.add(rim);

        // Raios do aro (5 raios)
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            const spokeGeo = new THREE.BoxGeometry(0.08, 0.05, 0.55);
            const spoke = new THREE.Mesh(spokeGeo, rimMaterial);
            spoke.position.set(0, Math.sin(angle) * 0.18, Math.cos(angle) * 0.18);
            spoke.rotation.x = angle;
            wheelGroup.add(spoke);
        }

        // Centro
        const hubGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.32, 16);
        const hub = new THREE.Mesh(hubGeo, chromeMaterial);
        hub.rotation.z = Math.PI / 2;
        wheelGroup.add(hub);

        wheelGroup.position.set(x, 0.45, z);
        return wheelGroup;
    }

    const wheelPositions = [
        [-1.0, 1.4], [1.0, 1.4],    // frente
        [-1.0, -1.4], [1.0, -1.4]   // trás
    ];
    const wheels = wheelPositions.map(([x, z]) => {
        const w = createWheel(x, z);
        carGroup.add(w);
        return w;
    });

    // Paralamas (fender flares — característica off-road)
    const flareMaterial = new THREE.MeshStandardMaterial({
        color: 0x0a0a0a,
        roughness: 0.8,
        metalness: 0.2
    });
    wheelPositions.forEach(([x, z]) => {
        const flareGeo = new THREE.BoxGeometry(0.35, 0.15, 1.1);
        const flare = new THREE.Mesh(flareGeo, flareMaterial);
        flare.position.set(x, 0.85, z);
        carGroup.add(flare);
    });

    // Step lateral
    const stepGeo = new THREE.BoxGeometry(0.1, 0.08, 2.2);
    for (let x of [-1.05, 1.05]) {
        const step = new THREE.Mesh(stepGeo, darkMaterial);
        step.position.set(x, 0.4, -0.1);
        carGroup.add(step);
    }

    carGroup.position.y = 0;
    scene.add(carGroup);

    // --- Gerar swatches de cor ---
    const colorGrid = document.getElementById('color-grid');
    colors.forEach((c, i) => {
        const btn = document.createElement('button');
        btn.className = 'color-option' + (i === 0 ? ' active' : '');
        btn.innerHTML = `
            <div class="color-swatch" style="background: #${c.hex.toString(16).padStart(6, '0')}"></div>
            <div class="color-info">
                <div class="color-name">${c.name}</div>
                <div class="color-code">${c.code}</div>
            </div>
        `;
        btn.addEventListener('click', () => selectColor(i));
        colorGrid.appendChild(btn);
    });

    function selectColor(index) {
        currentColorIndex = index;
        const c = colors[index];

        // Animar troca de cor
        const targetColor = new THREE.Color(c.hex);
        const startColor = bodyMaterial.color.clone();
        const startMetalness = bodyMaterial.metalness;
        const startRoughness = bodyMaterial.roughness;
        const duration = 600;
        const startTime = performance.now();

        function animate() {
            const elapsed = performance.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);

            bodyMaterial.color.lerpColors(startColor, targetColor, eased);
            bodyMaterial.metalness = startMetalness + (c.metallic - startMetalness) * eased;
            bodyMaterial.roughness = startRoughness + (c.roughness - startRoughness) * eased;

            if (t < 1) requestAnimationFrame(animate);
        }
        animate();

        // Update UI
        document.querySelectorAll('.color-option').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
        document.getElementById('current-color-name').textContent = c.name;
        document.getElementById('current-color-code').textContent = '/ ' + c.code;

        // Preço animado
        animatePrice(c.price);
    }

    function animatePrice(target) {
        const priceEl = document.getElementById('price');
        const current = parseInt(priceEl.textContent.replace(/\./g, ''));
        const duration = 500;
        const startTime = performance.now();

        function step() {
            const elapsed = performance.now() - startTime;
            const t = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            const val = Math.round(current + (target - current) * eased);
            priceEl.textContent = val.toLocaleString('pt-BR');
            if (t < 1) requestAnimationFrame(step);
        }
        step();
    }

    // Tabs interaction (placeholder)
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
        });
    });

    // Stop auto-rotate on interaction
    controls.addEventListener('start', () => { controls.autoRotate = false; });

    // Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    function render() {
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(render);
    }
    render();

    // Hide loader
    setTimeout(() => {
        document.getElementById('loader').classList.add('hidden');
    }, 800);
</script>
